name: MVP 2.4 Scheduled Monitor Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run scheduled monitor tests
        run: node tests/monitor.test.js
      - name: Run alert outbox tests
        run: node tests/alert-outbox.test.js
      - name: Run alert delivery tests
        run: node tests/alert-delivery.test.js
