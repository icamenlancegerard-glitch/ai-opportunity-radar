name: History Engine Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  history-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run deterministic history tests
        run: node tests/history-engine.test.js
