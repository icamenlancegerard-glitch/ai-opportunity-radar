name: MVP 2.3 Identity and Alert Boundary Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test-boundaries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run identity tests
        run: node tests/request-identity.test.js
      - name: Run session tests
        run: node tests/session.test.js
      - name: Run authenticated saved-search tests
        run: node tests/saved-searches-api.test.js
      - name: Run alert outbox tests
        run: node tests/alert-outbox.test.js
      - name: Run alert delivery tests
        run: node tests/alert-delivery.test.js
      - name: Run monitored alert inbox tests
        run: node tests/alerts-all.test.js
