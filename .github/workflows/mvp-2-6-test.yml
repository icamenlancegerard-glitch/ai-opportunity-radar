name: MVP 2.7 User Evidence Loop Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test-source-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run source policy tests
        run: node tests/source-policy.test.js
      - name: Run monitored source tests
        run: node tests/monitored-sources.test.js
      - name: Run monitor tests
        run: node tests/monitor.test.js
      - name: Run alert inbox tests
        run: node tests/alerts-all.test.js
