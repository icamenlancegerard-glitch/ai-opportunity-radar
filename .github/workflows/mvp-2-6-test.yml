name: MVP 2.9 Alert Preferences + Provider Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test-source-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run source policy tests
        run: node tests/source-policy.test.js
      - name: Run monitored source tests
        run: node tests/monitored-sources.test.js
      - name: Run monitor tests
        run: node tests/monitor.test.js
      - name: Run lifecycle-backed alert inbox test
        run: node tests/monitored-sources.test.js
      - name: Run Supabase adapter tests
        run: node tests/supabase-provider.test.js
      - name: Run Resend adapter tests
        run: node tests/resend-delivery.test.js
