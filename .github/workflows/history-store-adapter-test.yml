name: History Store Adapter Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  history-store:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run adapter test
        run: node tests/history-store-adapter.test.js
