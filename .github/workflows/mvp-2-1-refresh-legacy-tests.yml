name: MVP 2.1 Legacy Test Fixture Refresh

on:
  push:
    branches: ["mvp-2-1-server-saved-searches"]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message != 'MVP 2.1: refresh legacy test fixtures'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh expectations that no longer match the current provider/status contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          ph = Path("tests/ph-eligibility-evidence.test.js")
          text = ph.read_text()
          old = "      'PH_ELIGIBLE:must be based in the philippines'"
          new = "      'PH_ELIGIBLE:based in the philippines',\n      'PH_ELIGIBLE:must be based in the philippines'"
          if text.count(old) != 1:
              raise SystemExit("Expected exactly one PH eligibility fixture line")
          ph.write_text(text.replace(old, new, 1))

          hs = Path("tests/history-store-adapter.test.js")
          text = hs.read_text()
          pattern = re.compile(
              r"assert\.deepEqual\(\s*getHistoryStorageStatus\(\),\s*\{\s*"
              r"storage:\s*'memory-only',\s*durable:\s*false\s*\}\s*\);"
          )
          replacement = """assert.deepEqual(getHistoryStorageStatus(), {
    storage: 'memory-only',
    durable: false,
    configured: false,
    providerBoundary: 'HTTP'
  });"""
          text2, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("Expected exactly one legacy history storage assertion")
          hs.write_text(text2)
          PY
      - name: Commit refreshed fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ph-eligibility-evidence.test.js tests/history-store-adapter.test.js
          git diff --cached --quiet && exit 0
          git commit -m "MVP 2.1: refresh legacy test fixtures"
          git push
